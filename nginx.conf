# Cấu hình Nginx cho Tool Lyric by lekimlamcode
# Reverse proxy chuyển tiếp cổng 80/443 sang FastAPI (port 7864)

server {
    listen 80;
    server_name localhost;

    # Cho phép upload file âm thanh lớn (mặc định Nginx chỉ cho 1MB)
    client_max_body_size 100M;

    # Tăng thời gian chờ cho AI xử lý bài hát dài (5 phút)
    client_body_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Chuyển toàn bộ request sang backend FastAPI
    location / {
        proxy_pass http://127.0.0.1:7864;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (nếu dùng realtime)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Cache static files (CSS, JS) để tải nhanh hơn
    location /static/ {
        proxy_pass http://127.0.0.1:7864/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
